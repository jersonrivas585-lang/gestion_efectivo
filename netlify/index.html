<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13302E">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Efectivo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="/config.js"></script>
<title>Gestión de Efectivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F6F5; --surface:#FFFFFF; --sunk:#E8EEEC; --line:#D6DFDC;
  --ink:#13302E; --ink2:#3C5552; --muted:#647774;
  --teal:#1C7A72; --teal-soft:#CDE7E3; --sun:#C98512; --sun-soft:#F6E7C8;
  --over:#B3261E; --over-soft:#F5D5D2; --good:#2F7D3A;
  --bar-spent:#13302E; --bar-left:#8CCBC3;
  --radius:14px; --radius-s:9px;
  --font:"Schibsted Grotesk", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1918; --surface:#152321; --sunk:#1B2D2B; --line:#2A3F3C;
    --ink:#E4EEEC; --ink2:#B9CAC6; --muted:#8FA4A0;
    --teal:#5CC2B6; --teal-soft:#1D3B37; --sun:#E8B04F; --sun-soft:#3A2F17;
    --over:#F08A80; --over-soft:#3D1F1C; --good:#7CCB86;
    --bar-spent:#E4EEEC; --bar-left:#2E6B64;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1918; --surface:#152321; --sunk:#1B2D2B; --line:#2A3F3C;
  --ink:#E4EEEC; --ink2:#B9CAC6; --muted:#8FA4A0;
  --teal:#5CC2B6; --teal-soft:#1D3B37; --sun:#E8B04F; --sun-soft:#3A2F17;
  --over:#F08A80; --over-soft:#3D1F1C; --good:#7CCB86;
  --bar-spent:#E4EEEC; --bar-left:#2E6B64;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--over)} .pos{color:var(--good)} .muted{color:var(--muted)}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:1fr;min-height:100vh}
.side{display:none}
.main{min-width:0;padding:0 16px 96px}
.wrap{max-width:1040px;margin:0 auto}
@media (min-width:900px){
  .app{grid-template-columns:232px 1fr}
  .side{display:flex;flex-direction:column;gap:2px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:20px 12px;border-right:1px solid var(--line);background:var(--surface);overflow:auto}
  .main{padding:0 32px 48px}
  .bottom{display:none!important}
}
.brand{display:flex;flex-direction:column;padding:4px 10px 18px}
.brand b{font-size:19px;letter-spacing:-.01em}
.brand span{font-size:12.5px;color:var(--muted)}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--ink2);font-weight:500}
.navbtn:hover{background:var(--sunk)}
.navbtn[aria-current="page"]{background:var(--teal-soft);color:var(--ink);font-weight:700}
.navbtn svg{width:19px;height:19px;flex:none}
.navsep{height:1px;background:var(--line);margin:10px 6px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);display:flex;align-items:center;gap:10px;padding:12px 0 10px;border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
.top h2{margin:0;font-size:17px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.monthpick{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.monthpick button{border:0;background:none;width:30px;height:30px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--ink2)}
.monthpick button:hover{background:var(--sunk)}
.monthpick select{border:0;background:none;font-weight:600;padding:4px 2px;cursor:pointer}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);padding:4px 0;cursor:pointer;font-weight:500}
.bottom button svg{width:22px;height:22px}
.bottom button[aria-current="page"]{color:var(--teal);font-weight:700}

/* ---------- Components ---------- */
.section{margin:22px 0}
.section > h3{font-size:15px;margin:0 0 10px;font-weight:700;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.section > h3 small{font-weight:500;color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.danger{color:var(--over);border-color:var(--over-soft)}
.btn.small{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--ink2)}
.pill.open{background:var(--teal-soft);color:var(--teal)}
.pill.warn{background:var(--sun-soft);color:var(--sun)}
.pill.bad{background:var(--over-soft);color:var(--over)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-height:40px}
.input:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 3px var(--teal-soft)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}
.toolbar .input{flex:1 1 180px;width:auto}
.toolbar select.input{flex:0 1 220px}
.notice{border-radius:var(--radius-s);padding:10px 14px;background:var(--sun-soft);color:var(--ink);display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
.notice.info{background:var(--teal-soft)}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* Hero: the month ledger */
.hero{padding:18px 0 8px}
.hero .mtitle{font-size:clamp(34px,7vw,56px);line-height:1;font-weight:800;letter-spacing:-.035em;margin:0}
.hero .mtitle .yr{display:block;font-size:.42em;font-weight:600;letter-spacing:-.01em;color:var(--muted);margin-top:6px}
.hero p.say{font-size:17px;margin:14px 0 14px;max-width:62ch;color:var(--ink2)}
.hero p.say strong{color:var(--ink)}
.ledger{position:relative;height:30px;border-radius:8px;background:var(--sunk);overflow:hidden;display:flex}
.ledger i{display:block;height:100%}
.ledger .sp{background:var(--bar-spent)}
.ledger .lf{background:var(--bar-left)}
.ledger .ov{background:var(--over)}
.ledger-mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--sun)}
.ledger-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.ledger-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.figs{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-top:18px}
@media (min-width:700px){.figs{grid-template-columns:repeat(5,1fr)}}
.fig{background:var(--surface);padding:12px 14px;cursor:pointer;border:0;text-align:left}
.fig:hover{background:var(--sunk)}
.fig small{display:block;color:var(--muted);font-size:12.5px}
.fig b{display:block;font-size:18px;font-weight:700;margin-top:2px}
.fig.wide{grid-column:span 2}
@media (min-width:700px){.fig.wide{grid-column:auto}}

.figs.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.figs.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.fig{min-width:0}
.fig b{overflow:hidden;text-overflow:ellipsis}
/* Envelopes (sobres) */
.env{display:grid;grid-template-columns:minmax(110px,1.1fr) 2fr auto;gap:6px 14px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.env:last-child{border-bottom:0}
.env:hover{background:var(--sunk)}
.env .nm{font-weight:600;line-height:1.2}
.env .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.track{position:relative;height:12px;background:var(--sunk);border-radius:6px;overflow:visible}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--teal)}
.track .fill.hot{background:var(--sun)}
.track .fill.over{background:var(--over)}
.track .cap{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.env .rest{text-align:right;font-size:13.5px;min-width:96px}
.env .rest b{display:block;font-size:14.5px}
@media (max-width:560px){
  .env{grid-template-columns:1fr auto}
  .env .track{grid-column:1 / -1;order:3}
}

/* Lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.day{display:flex;justify-content:space-between;padding:8px 14px;background:var(--sunk);font-size:13px;font-weight:600;color:var(--ink2);}
.item{display:flex;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.day + .item{border-top:0}
.item:hover{background:var(--sunk)}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tx small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:700;text-align:right}
.item .amt small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--teal)}
.sumline{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:4px 2px 10px;color:var(--muted);font-size:14px}
.sumline b{color:var(--ink);font-size:16px}

/* Budget groups */
.bgroup{border-top:1px solid var(--line)}
.bgroup:first-child{border-top:0}
.bhead{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;align-items:center}
.bhead .t{font-weight:700}
.bhead .meta{font-size:13px;color:var(--muted)}
.bhead .track{grid-column:1 / -1}
.bline{display:grid;grid-template-columns:1fr 92px 92px;gap:10px;padding:8px 14px 8px 26px;font-size:14px;border-top:1px dashed var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.bline:hover{background:var(--sunk)}
.bline .num{text-align:right}
.bline.ghost{cursor:default;color:var(--muted);font-style:italic}
.bline.ghost:hover{background:none}
.bcols{display:grid;grid-template-columns:1fr 92px 92px;gap:10px;padding:8px 14px 8px 26px;font-size:12px;color:var(--muted)}
.bcols span:not(:first-child){text-align:right}

/* Tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t th,table.t td{padding:8px 11px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
table.t th{background:var(--sunk);font-weight:600;color:var(--ink2);position:sticky;top:0}
table.t td.n,table.t th.n{text-align:right}
table.t tbody tr{cursor:pointer}
table.t tbody tr:hover{background:var(--sunk)}
table.t tfoot td{font-weight:700;background:var(--sunk)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-weight:500;font-size:13.5px}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.grid-more{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.morecard{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:14px;cursor:pointer}
.morecard:hover{background:var(--sunk)}
.morecard svg{width:22px;height:22px;color:var(--teal);flex:none;margin-top:2px}
.morecard b{display:block}
.morecard small{color:var(--muted);font-size:13px}

.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--font);font-size:10px;fill:var(--muted)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.toggle{position:relative;display:inline-block;vertical-align:middle;width:40px;height:24px;flex:none}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle span{position:absolute;inset:0;background:var(--line);border-radius:999px;cursor:pointer;transition:background .15s}
.toggle span::after{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:var(--surface);transition:transform .15s}
.toggle input:checked + span{background:var(--teal)}
.toggle input:checked + span::after{transform:translateX(16px)}
.toggle input:focus-visible + span{outline:3px solid var(--teal);outline-offset:2px}

/* Modal sheet */
.scrim{position:fixed;inset:0;background:rgba(5,20,18,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:calc(100% - env(safe-area-inset-top,0px) - 16px);overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px;padding:22px}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.sheet h4{margin:0 0 14px;font-size:18px;display:flex;align-items:center;gap:8px}
.sheet h4 .x{margin-left:auto;border:0;background:var(--sunk);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;grid-column:1 / -1}
.field.half{grid-column:auto}
.field[hidden]{display:none}
.field label{font-size:13px;font-weight:600;color:var(--ink2)}
.field .hint{font-size:12px;color:var(--muted)}
.field.check{flex-direction:row;align-items:center;justify-content:space-between}
.sheet .actions{display:flex;gap:8px;margin-top:18px}
.sheet .actions .spacer{flex:1}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;z-index:60;font-weight:600;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
@media (min-width:900px){.toast{bottom:28px}}
.toast.err{background:var(--over);color:#fff}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--paper);z-index:70}
.loading div{text-align:center;color:var(--muted)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--teal);animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:24;width:56px;height:56px;border-radius:18px;border:0;background:var(--ink);color:var(--paper);display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 22px rgba(10,40,38,.28)}
.fab svg{width:26px;height:26px}
@media (min-width:900px){.fab{display:none}}
.desk-only{display:none}
@media (min-width:900px){.desk-only{display:inline-flex}}
.locked .app,.locked .bottom,.locked .fab{display:none!important}
.login{position:fixed;inset:0;z-index:65;display:grid;place-items:center;padding:24px 18px;background:var(--paper);overflow:auto}
.login[hidden]{display:none}
.login-card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.login-card[hidden]{display:none}
.login-mark{width:56px;height:56px}
.login-card h1{margin:4px 0 0;font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}
.login-card > p{margin:0}
.login-btn{width:100%;padding:12px;font-size:15.5px;margin-top:2px}
.login-msg{min-height:0;color:var(--over);font-size:14px;font-weight:600}
.login-msg:empty{display:none}
.login-help{font-size:13px;text-align:center}
.pwd{position:relative}
.pwd .input{padding-right:58px}
.pwd-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:var(--sunk);border-radius:7px;padding:5px 9px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink2)}
.bankgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.bankcard{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:14px 16px;cursor:pointer}
.bankcard:hover{background:var(--sunk)}
.bankcard.on{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-soft)}
.bankcard small{color:var(--muted);font-size:12.5px}
.bankcard b{font-size:15px}
.bankcard .bal{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.fpreview{grid-column:1 / -1;font-size:13.5px;background:var(--teal-soft);border-radius:9px;padding:9px 12px}
.fpreview:empty{display:none}
.imp-err{color:var(--over);font-size:13px;margin:4px 0}
.perms{display:grid;grid-template-columns:1fr;gap:2px;border:1px solid var(--line);border-radius:10px;padding:6px}
.perm{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:14px}
.field label.perm{font-weight:400;color:var(--ink)}
.perm:hover{background:var(--sunk)}
.perm input{width:17px;height:17px;accent-color:var(--teal)}
.perm code{font-size:11px;color:var(--muted)}
.perm.custom{background:var(--sun-soft)}
@media (max-width:560px){.perm code{display:none}.bankcard{padding:12px}.bankcard .bal{font-size:18px}.bankcard b{font-size:14px}}
.sideuser{margin-top:auto;padding:14px 10px 4px;border-top:1px solid var(--line);font-size:13.5px}
.sideuser b{display:block}
.sideuser button{border:0;background:none;padding:4px 0;color:var(--teal);cursor:pointer;font-weight:600}
.demo-banner{font-size:13px;background:var(--sun-soft);color:var(--ink);padding:7px 12px;border-radius:9px;margin-top:10px}
@media (max-width:560px){
  .figs.three .fig{padding:9px 8px}
  .figs.three .fig b{font-size:13px}
  .figs.three .fig small{font-size:11px}
  .bline,.bcols{grid-template-columns:minmax(0,1fr) 82px 82px;padding-left:14px;padding-right:12px;font-size:12.5px;gap:6px}
  .bcols{font-size:11px}
}
</style>

      if (ex && DB.t.Ingresos_Detalle.some(x => String(x.ID_DetIngresos) === String(ex))) row.ID_DetIngresos = ex;
      const ing = this._saveDet('Ingresos_Detalle', row, mes, ch);

    } else if (ex) { this._removeDet('Ingresos_Detalle', ex, ch); this._add(ch, table, this._upsert(table, Object.assign({}, saved, {ID_Ingreso_Auto: ''}))); }
  },
  _removeDet(table, id, ch) {
    const k = DB.key(table); const old = DB.t[table].find(x => String(x[k]) === String(id)); if (!old) return {};
    DB.t[table] = DB.t[table].filter(x => String(x[k]) !== String(id)); DB.ver++;
    (ch.deletes[table] = ch.deletes[table] || []).push(id);

  },
  _guard(table, id) { if (table !== 'Ingresos_Detalle' || !id) return; const r = DB.t.Ingresos_Detalle.find(x => String(x.ID_DetIngresos) === String(id)); if (r && r.Origen) throw new Error('Este ingreso se generó desde un retiro o una transferencia en dólares. Edítalo desde allí.'); },

  replaceMany(p) {

    DB.t[p.table] = DB.t[p.table].filter(d => String(d[rel.fk]) !== String(hid)); DB.ver++;

  repair() { return {report: []}; },
  saveMany(p) {
    const ch = {upserts: {}, deletes: {}}; const rel = REL[p.table]; ch.upserts[p.table] = [];

    p.rows.forEach(r => { r = Object.assign({}, r); delete r[DB.key(p.table)]; if (rel) { r[rel.fk] = hid; r.Fecha_Registro = r.Fecha_Registro || todayISO(); } ch.upserts[p.table].push(this._upsert(p.table, r)); });

  },
  remove(p) {

    const old = this._removeDet(p.table, p.id, ch);

  },
  saveResumen(p) {
    const t = totals(p.mes);
    const r = this._upsert('Resumen', {Fecha_Registro: todayISO(), Hora_Registro: nowISO(), Total_Ingresos: t.I, Total_Presupuesto: t.P,

  addYear(p) {

  }
};

/* ---------- Gráficos SVG ---------- */
function barChart(labels, series, {h = 200, fmt = kfmt, marks} = {}) {
  const avail = Math.max(300, Math.min(window.innerWidth - (window.innerWidth >= 900 ? 330 : 70), 980));
  const n = labels.length, gw = Math.max(22, Math.min(90, (avail - 40) / Math.max(n, 1))), padL = 34, padB = 22, W = padL + n * gw + 6, H = h;
  const max = Math.max(1, ...series.flatMap(s => s.values.map(v => Math.abs(v || 0))), ...(marks ? marks.values : [0]));
  const y = v => (H - padB) - (v / max) * (H - padB - 10);
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = max * i / 4, yy = y(v); g += `<line x1="${padL}" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${padL - 6}" y="${yy + 3}" text-anchor="end">${fmt(v)}</text>`; }
  const bw = (gw - 8) / series.length;
  labels.forEach((l, i) => {
    series.forEach((s, j) => { const v = Math.max(0, s.values[i] || 0), x = padL + i * gw + 4 + j * bw;
      g += `<rect x="${x}" y="${y(v)}" width="${Math.max(bw - 2, 2)}" height="${(H - padB) - y(v)}" rx="2" fill="${s.color}"><title>${esc(l)}: ${esc(s.name)} ${money(v)}</title></rect>`; });
    if (marks && marks.values[i]) { const yy = y(marks.values[i]); g += `<line x1="${padL + i * gw + 2}" x2="${padL + (i + 1) * gw - 2}" y1="${yy}" y2="${yy}" stroke="${marks.color}" stroke-width="2.5"><title>${esc(l)}: ${esc(marks.name)} ${money(marks.values[i])}</title></line>`; }
    if (n <= 16 || i % Math.ceil(n / 16) === 0) g += `<text x="${padL + i * gw + gw / 2}" y="${H - 6}" text-anchor="middle">${esc(l)}</text>`;
  });
  const leg = series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('') + (marks ? `<span><i style="background:${marks.color};height:3px"></i>${esc(marks.name)}</span>` : '');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico">${g}</svg><div class="legend">${leg}</div></div>`;
}
function lineChart(labels, values, {h = 180, fmt = v => v.toFixed(1), color = 'var(--teal)', name = ''} = {}) {
  const n = labels.length, padL = 34, padB = 22, W = Math.max(300, Math.min(window.innerWidth - (window.innerWidth >= 900 ? 330 : 70), 980)), H = h;
  const vs = values.filter(v => v > 0); const max = Math.max(...vs, 1) * 1.08, min = Math.min(...vs, max) * .9;
  const x = i => padL + (n === 1 ? 0 : i * (W - padL - 10) / (n - 1)), y = v => (H - padB) - ((v - min) / (max - min || 1)) * (H - padB - 10);
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = min + (max - min) * i / 4; g += `<line x1="${padL}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${padL - 6}" y="${y(v) + 3}" text-anchor="end">${fmt(v)}</text>`; }
  const pts = values.map((v, i) => v > 0 ? [x(i), y(v)] : null).filter(Boolean);
  g += `<polyline fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" points="${pts.map(p => p.join(',')).join(' ')}"/>`;
  values.forEach((v, i) => { if (v > 0) g += `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${color}"><title>${esc(labels[i])}: ${fmt(v)} ${esc(name)}</title></circle>`;
    if (i % Math.ceil(n / 10) === 0) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${esc(labels[i])}</text>`; });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de línea">${g}</svg></div>`;
}
function track(p, g) {
  if (p <= 0 && g <= 0) return '<div class="track"></div>';
  const max = Math.max(p, g), w = max ? g / max * 100 : 0, capAt = max ? p / max * 100 : 0;
  const cls = p === 0 || g > p ? 'over' : (g > p * .85 ? 'hot' : '');
  return `<div class="track"><div class="fill ${cls}" style="width:${w}%"></div>${p > 0 ? `<div class="cap" style="left:calc(${capAt}% - 1px)"></div>` : ''}</div>`;
}

  <div class="figs three">
    <div class="fig"><small>Retirado</small><b class="num">${money(t.R)}</b></div>
    <div class="fig"><small>Gastado</small><b class="num">${money(t.G)}</b></div>

  <div class="toolbar"><span class="spacer"></span>${canEdit('Retiros') ? '<button class="btn primary desk-only" data-new="Retiros_Detalle">Registrar retiro</button>' : ''}</div>
  ${rows.length ? `<div class="list">${listGrouped(rows.slice().sort((a, b) => b.Id_DetRetiros - a.Id_DetRetiros), 'Fecha_Retiro', r => `

V.bancos = () => {
  const bs = bancos();

  if (!S.banco || !banco(S.banco)) S.banco = String(bs[0].ID_Banco);
  const L = {}; bs.forEach(b => L[b.ID_Banco] = ledger(b.ID_Banco));
  const totNIO = r2(bs.filter(b => b.Moneda === 'NIO').reduce((a, b) => a + L[b.ID_Banco].saldo, 0));
  const totUSD = r2(bs.filter(b => b.Moneda === 'USD').reduce((a, b) => a + L[b.ID_Banco].saldo, 0));

  <section class="section"><div class="bankgrid">${bs.map(b => `<button class="bankcard ${String(b.ID_Banco) === S.banco ? 'on' : ''}" data-banco="${b.ID_Banco}">
    <small>${esc(b.Banco)}${b.Numero ? ', ' + esc(b.Numero) : ''}</small><b>${esc(b.Nombre)}</b>
    <span class="num bal ${L[b.ID_Banco].saldo < 0 ? 'neg' : ''}">${fcur(L[b.ID_Banco].saldo, b.Moneda)}</span>
    ${b.Moneda === 'USD' ? `<small class="num">≈ ${money(L[b.ID_Banco].saldo * lastTC())} a ${lastTC()}</small>` : '<small>&nbsp;</small>'}</button>`).join('')}</div>
    <div class="sumline" style="margin-top:12px"><span>Total en córdobas${totUSD ? ', más ' + usd(totUSD) : ''}</span><b class="num">${money(totNIO)}</b></div></section>
  <section class="section"><h3>${esc(mesLabel(S.mes))} <small>ingresos y retiros del mes por cuenta</small></h3>
    <div class="tablewrap"><table class="t"><thead><tr><th>Cuenta</th><th class="n">Ingresos</th><th class="n">Retiros</th></tr></thead><tbody>
    ${bs.map(b => `<tr data-banco="${b.ID_Banco}"><td>${esc(b.Nombre)}</td><td class="n">${money(sum(ing.filter(r => String(r.ID_Banco) === String(b.ID_Banco))))}</td><td class="n">${money(sum(ret.filter(r => String(r.ID_Banco) === String(b.ID_Banco))))}</td></tr>`).join('')}
    <tr style="cursor:default"><td>Efectivo o sin banco</td><td class="n">${money(sinBancoI)}</td><td class="n">${money(sum(ret.filter(r => r.ID_Banco === '' || r.ID_Banco === undefined)))}</td></tr></tbody>
    <tfoot><tr><td>Total del mes</td><td class="n">${money(sum(ing))}</td><td class="n">${money(sum(ret))}</td></tr></tfoot></table></div>
    ${sinBancoR ? `<p class="muted" style="font-size:13px">${sinBancoR} retiros de este mes no tienen banco asignado. Ábrelos en Retiros y elige la cuenta para que los saldos cuadren.</p>` : ''}</section>
  <section class="section"><h3>Movimientos de ${esc(cur.Nombre)} <small>${led.start ? 'desde ' + fdate(led.start) + ', saldo inicial ' + fcur(led.inicial, cur.Moneda) : ''}</small></h3>
    <div class="toolbar" style="margin-top:0">${ed ? '<button class="btn primary" data-act="mov-transfer">Transferir entre cuentas</button><button class="btn" data-act="mov-dep">Depósito o ajuste</button>' : ''}<span class="spacer"></span>${can('catalogos.editar') ? `<button class="btn small" data-edit="Bancos" data-id="${cur.ID_Banco}">Saldo inicial y datos</button>` : ''}</div>
    ${shown.length ? `<div class="list">${shown.map(r => `<button class="item" data-edit="${r.src.t}" data-id="${r.src.id}"><span class="dot" style="background:${r.amt >= 0 ? 'var(--good)' : 'var(--sun)'}"></span>
      <span class="tx"><b>${esc(r.desc)}</b><small>${fdate(r.fecha)}, ${esc(r.tipo)}${r.alt ? ', ' + r.alt + ' en córdobas' : ''}</small></span>
      <span class="amt num ${r.amt >= 0 ? 'pos' : ''}">${r.amt >= 0 ? '+' : ''}${fcur(r.amt, cur.Moneda)}<small>Saldo ${fcur(r.bal, cur.Moneda)}</small></span></button>`).join('')}</div>`

V.presupuesto = () => {
  const P = detail('Presupuesto_Detalle', S.mes), G = detail('Gastos_Detalle', S.mes), ed = canEdit('Presupuesto');
  const prev = mesAnterior(S.mes), prevRows = prev ? detail('Presupuesto_Detalle', prev) : [];
  const ing = sum(detail('Ingresos_Detalle', S.mes)), tp = sum(P);
  const accs = [...new Set([...P.map(p => p.Cuenta_Gastos), ...G.map(g => g.Cuenta_Gastos)])].sort();
  const norm = s => String(s || '').trim().toLowerCase();
  const groups = accs.map(a => {
    const pr = P.filter(p => p.Cuenta_Gastos === a), gr = G.filter(g => g.Cuenta_Gastos === a);
    const used = new Set();
    const lines = pr.map(p => { const m = gr.filter(g => norm(g.Descripcion_Gasto) === norm(p.Descripcion)); m.forEach(x => used.add(x)); return {p, g: sum(m)}; });
    const otros = sum(gr.filter(g => !used.has(g)));
    return {a, pr, lines, otros, tp: sum(pr), tg: sum(gr)};
  }).sort((x, y) => y.tp - x.tp);
  return `${lockNote('Presupuesto')}
  <div class="figs three">
    <div class="fig"><small>Ingresos</small><b class="num">${money(ing)}</b></div>
    <div class="fig"><small>Presupuestado</small><b class="num">${money(tp)}</b></div>
    <div class="fig"><small>Sin asignar</small><b class="num ${ing - tp < 0 ? 'neg' : ''}">${money(ing - tp)}</b></div>
  </div>
  <div class="toolbar"><span class="spacer"></span>
    <button class="btn" data-act="tpl-ppto">Descargar plantilla</button>
    ${ed ? '<button class="btn" data-act="imp-ppto">Importar desde Excel</button>' : ''}
    ${ed && prevRows.length ? `<button class="btn" data-act="copiar-ppto">Copiar de ${esc(mesLabel(prev))}</button>` : ''}
    ${ed ? '<button class="btn primary desk-only" data-new="Presupuesto_Detalle">Agregar partida</button>' : ''}
  </div>
  ${groups.length ? `<div class="list">${groups.map(g => `
    <div class="bgroup">
      <div class="bhead"><span class="t">${esc(cuentaNombre(g.a))}</span><span class="num ${g.tp - g.tg < 0 ? 'neg' : ''}" style="font-weight:700">${money(g.tp - g.tg)}</span>
        ${track(g.tp, g.tg)}<span class="meta">Gastado ${money(g.tg)} de ${money(g.tp)}</span></div>
      <div class="bcols"><span>Partida</span><span>Presupuesto</span><span>Gastado</span></div>
      ${g.lines.map(l => `<button class="bline" data-edit="Presupuesto_Detalle" data-id="${l.p.ID_DetPresupuesto}"><span>${esc(l.p.Descripcion)}${Number(l.p.Cantidad) > 1 ? ` <span class="muted">(${l.p.Cantidad} ${esc(l.p.UM)})</span>` : ''}</span><span class="num">${money(l.p.Total)}</span><span class="num ${l.g > l.p.Total ? 'neg' : ''}">${money(l.g)}</span></button>`).join('')}
      ${g.otros ? `<div class="bline ghost"><span>Otros gastos sin partida</span><span class="num">—</span><span class="num">${money(g.otros)}</span></div>` : ''}
    </div>`).join('')}</div>`
    : `<div class="panel empty"><b>Este mes no tiene presupuesto</b>${ed && prevRows.length ? `Copia las ${prevRows.length} partidas de ${esc(mesLabel(prev))} y ajusta lo que cambie.` : 'Agrega una partida por cada compromiso del mes.'}</div>`}`;
};

V.mas = () => `<div class="grid-more" style="margin-top:14px">${MORE.map(v => `<button class="morecard" data-go="${v}">${ico(VIEWS[v].icon)}<span><b>${VIEWS[v].t}</b><small>${VIEWS[v].d}</small></span></button>`).join('')}</div>`;

V.historico = () => {
  const ms = mesesConDatos(); const years = [...new Set(ms.map(m => m.split('-')[1]))].sort();
  if (!S.anio) S.anio = (S.mes || ms[ms.length - 1]).split('-')[1];
  const yRows = years.map(y => { const t = ms.filter(m => m.endsWith(y)).map(totals); return {y, I: sum(t, 'I'), P: sum(t, 'P'), G: sum(t, 'G'), R: sum(t, 'R')}; });
  const months = ms.filter(m => m.endsWith(S.anio)); const T = months.map(m => Object.assign({m}, totals(m)));
  return `
  <section class="section"><h3>Por año</h3><div class="panel">${barChart(yRows.map(r => r.y), [{name: 'Ingresos', values: yRows.map(r => r.I), color: 'var(--bar-left)'}, {name: 'Gastos', values: yRows.map(r => r.G), color: 'var(--bar-spent)'}])}</div></section>

  <section class="section"><h3>Meses de ${S.anio}</h3>
  <div class="tablewrap"><table class="t"><thead><tr><th>Mes</th><th class="n">Ingresos</th><th class="n">Presupuesto</th><th class="n">Gastos</th><th class="n">Retiros</th><th class="n">Ingresos − gastos</th><th class="n">En mano</th></tr></thead>
  <tbody>${T.map(x => `<tr data-mes="${x.m}"><td>${mesLabel(x.m)}</td><td class="n">${money(x.I)}</td><td class="n">${money(x.P)}</td><td class="n">${money(x.G)}</td><td class="n">${money(x.R)}</td><td class="n ${x.IG < 0 ? 'neg' : ''}">${money(x.IG)}</td><td class="n ${x.mano < 0 ? 'neg' : ''}">${money(x.mano)}</td></tr>`).join('')}</tbody>

  <p class="muted" style="font-size:13px">Toca un mes para abrir su resumen.</p></section>`;

V.cuenta = () => {
  const ctas = DB.t.Cuentas.filter(c => truthy(c.Cuenta_de_Gastos));
  const ms = mesesConDatos(); const sel = S.rango ? ms.slice(-S.rango) : ms;
  const G = sel.map(m => sum(detail('Gastos_Detalle', m).filter(r => r.Cuenta_Gastos === S.cuentaSel)));
  const P = sel.map(m => sum(detail('Presupuesto_Detalle', m).filter(r => r.Cuenta_Gastos === S.cuentaSel)));
  const items = {}; sel.forEach(m => detail('Gastos_Detalle', m).filter(r => r.Cuenta_Gastos === S.cuentaSel).forEach(r => { const k = r.Descripcion_Gasto; items[k] = items[k] || {n: 0, t: 0}; items[k].n++; items[k].t += Number(r.Total) || 0; }));
  const top = Object.entries(items).sort((a, b) => b[1].t - a[1].t).slice(0, 12);

  return `
  <div class="toolbar"><select class="input" data-bind="cuentaSel" aria-label="Cuenta">${ctas.map(c => `<option value="${c.Codigo}" ${c.Codigo === S.cuentaSel ? 'selected' : ''}>${esc(c.Cuentas)}</option>`).join('')}</select>
    <div class="tabs" style="margin:0">${[[12, '12 meses'], [24, '24 meses'], [0, 'Todo']].map(([v, l]) => `<button class="tab" data-rango="${v}" aria-pressed="${S.rango === v}">${l}</button>`).join('')}</div></div>

    <div class="fig"><small>Gastado en el período</small><b class="num">${money(tg)}</b></div>
    <div class="fig"><small>Presupuestado</small><b class="num">${money(tp)}</b></div>
    <div class="fig"><small>Promedio por mes</small><b class="num">${money(act ? tg / act : 0)}</b></div>
  </div>
  <section class="section"><div class="panel">${barChart(sel.map(m => cap(m.slice(0, 3)) + ' ' + m.slice(-2)), [{name: 'Gastado', values: G, color: 'var(--bar-spent)'}], {marks: {name: 'Presupuesto', values: P, color: 'var(--sun)'}})}</div></section>
  <section class="section"><h3>En qué se va <small>artículos con más gasto</small></h3>
  ${top.length ? `<div class="tablewrap"><table class="t"><thead><tr><th>Descripción</th><th class="n">Veces</th><th class="n">Total</th><th class="n">Promedio</th></tr></thead><tbody>${top.map(([k, v]) => `<tr data-buscar="${esc(k)}"><td>${esc(k)}</td><td class="n">${v.n}</td><td class="n">${money(v.t)}</td><td class="n">${money(v.t / v.n)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="panel empty"><b>Sin gastos en este período</b></div>'}</section>`;

V.combustible = () => {

  </div>
  <section class="section"><h3>Rendimiento <small>últimos 30 llenados, km por litro</small></h3><div class="panel">${lineChart(last30.map(r => fdate(r.Fecha, {day: 'numeric', month: 'short'})), kml, {name: 'km/L'})}</div></section>

function parseBudget(wb) {
  const name = wb.SheetNames.find(n => nrm(n) === 'presupuesto') || wb.SheetNames[0];
  const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], {header: 1, raw: true, defval: ''});
  let hr = -1, map = {};
  for (let i = 0; i < Math.min(aoa.length, 20) && hr < 0; i++) {
    const m = {}; aoa[i].forEach((c, j) => { const h = nrm(c); Object.entries(HMAP).forEach(([k, al]) => { if (m[k] === undefined && al.includes(h)) m[k] = j; }); });
    if (m.cuenta !== undefined && m.total !== undefined && m.desc !== undefined) { hr = i; map = m; }
  }
  if (hr < 0) throw new Error('No encontré los encabezados. La hoja debe tener columnas Cuenta, Descripción y Monto (Cantidad y Unidad son opcionales).');
  const ums = {}; DB.t.UM.forEach(u => ums[nrm(u.UM)] = u.UM);
  const rows = [], errors = [], warns = [];
  for (let i = hr + 1; i < aoa.length; i++) {
    const r = aoa[i], fila = i + 1;
    const cta = r[map.cuenta], desc = String(r[map.desc] ?? '').trim(), tot = toNum(r[map.total]);
    if (!String(cta).trim() && !desc && (r[map.total] === '' || r[map.total] === undefined)) continue;
    if (/^total/.test(nrm(desc)) || /^total/.test(nrm(cta))) break; // lo que sigue a TOTAL son notas
    const c = findCuenta(cta);
    if (!c) { errors.push(`Fila ${fila}: la cuenta “${cta}” no existe en el catálogo.`); continue; }
    if (!desc) { errors.push(`Fila ${fila}: falta la descripción.`); continue; }
    if (isNaN(tot)) { errors.push(`Fila ${fila}: el monto “${r[map.total]}” no es un número.`); continue; }
    let um = 'Unidad';
    if (map.um !== undefined && String(r[map.um]).trim()) { um = ums[nrm(r[map.um])]; if (!um) { warns.push(`Fila ${fila}: unidad “${r[map.um]}” desconocida, se usará Unidad.`); um = 'Unidad'; } }
    const cant = map.cant !== undefined && String(r[map.cant]).trim() !== '' ? toNum(r[map.cant]) : 1;
    rows.push({Cuenta_Gastos: c.Codigo, Descripcion: desc, Cantidad: isNaN(cant) ? 1 : cant, UM: um, Total: r2(tot), _cta: c.Cuentas});
  }
  return {rows, errors, warns, hoja: name};
}
function pickBudgetFile() {
  if (!canEdit('Presupuesto')) return toast('El presupuesto de este mes está cerrado o no tienes permiso', true);
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.xlsx,.xls,.xlsm,.csv';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try { const X = await loadXLSX(); const wb = X.read(await f.arrayBuffer(), {type: 'array'}); S.imp = parseBudget(wb); S.imp.file = f.name; openImportPreview(); }
    catch (e) { toast(e.message || 'No se pudo leer el archivo', true); }
  };
  inp.click();
}
function openImportPreview() {
  const I = S.imp, existing = detail('Presupuesto_Detalle', S.mes).length, tot = sum(I.rows), ing = sum(detail('Ingresos_Detalle', S.mes));
  sheetModal('frmImp', 'Importar presupuesto de ' + mesLabel(S.mes), `
    <p style="margin:0 0 10px">${esc(I.file)}, hoja ${esc(I.hoja)}: <b>${I.rows.length} partidas</b> por <b>${money(tot)}</b>${ing ? `. Ingresos del mes: ${money(ing)}, quedarían ${money(ing - tot)} sin asignar` : ''}.</p>
    ${I.errors.length ? `<div class="notice" style="display:block"><b>${I.errors.length} filas no se importarán:</b>${I.errors.slice(0, 12).map(e => `<div class="imp-err">${esc(e)}</div>`).join('')}${I.errors.length > 12 ? `<div class="imp-err">y ${I.errors.length - 12} más…</div>` : ''}</div>` : ''}
    ${I.warns.length ? `<p class="muted" style="font-size:13px">${I.warns.slice(0, 5).map(esc).join('<br>')}</p>` : ''}
    ${I.rows.length ? `<div class="tablewrap" style="max-height:260px;overflow:auto;margin:10px 0"><table class="t"><thead><tr><th>Cuenta</th><th>Descripción</th><th class="n">Cant.</th><th>Unidad</th><th class="n">Monto</th></tr></thead><tbody>
      ${I.rows.map(r => `<tr style="cursor:default"><td>${esc(r._cta)}</td><td>${esc(r.Descripcion)}</td><td class="n">${r.Cantidad}</td><td>${esc(r.UM)}</td><td class="n">${money(r.Total)}</td></tr>`).join('')}</tbody></table></div>` : ''}
    ${existing ? `<div class="field check"><label for="impRep">Reemplazar las ${existing} partidas que ya tiene ${esc(mesLabel(S.mes))}</label><label class="toggle"><input type="checkbox" id="impRep" checked><span></span></label></div>
      <p class="muted" style="font-size:12.5px;margin:4px 0 0">Si lo desmarcas, las partidas del archivo se suman a las existentes.</p>` : ''}`,
    I.rows.length ? `Importar ${I.rows.length} partidas` : 'Cerrar');
}
function downloadBudgetTemplate() {
  loadXLSX().then(X => {
    const src = detail('Presupuesto_Detalle', S.mes).length ? S.mes : mesAnterior(S.mes);
    const rows = (src ? detail('Presupuesto_Detalle', src) : []).slice().sort((a, b) => String(a.Cuenta_Gastos).localeCompare(String(b.Cuenta_Gastos)));
    const aoa = [['Cuenta', 'Nombre de la cuenta', 'Descripción', 'Cantidad', 'Unidad', 'Monto']]
      .concat(rows.map(r => [r.Cuenta_Gastos, cuentaNombre(r.Cuenta_Gastos), r.Descripcion, Number(r.Cantidad) || 1, r.UM || 'Unidad', Number(r.Total) || 0]));
    const ws = X.utils.aoa_to_sheet(aoa); ws['!cols'] = [{wch: 9}, {wch: 26}, {wch: 44}, {wch: 10}, {wch: 10}, {wch: 14}];
    const cs = X.utils.aoa_to_sheet([['Código', 'Cuenta']].concat(DB.t.Cuentas.filter(c => truthy(c.Cuenta_de_Gastos) && truthy(c.Activa)).map(c => [c.Codigo, c.Cuentas]))); cs['!cols'] = [{wch: 9}, {wch: 30}];
    const us = X.utils.aoa_to_sheet([['Unidad']].concat(DB.t.UM.map(u => [u.UM])));
    const wb = X.utils.book_new(); X.utils.book_append_sheet(wb, ws, 'Presupuesto'); X.utils.book_append_sheet(wb, cs, 'Cuentas'); X.utils.book_append_sheet(wb, us, 'Unidades');
    X.writeFile(wb, 'Plantilla_Presupuesto_' + S.mes + '.xlsx');
  }).catch(e => toast(e.message, true));
}

/* ---------- Inicio de sesión ---------- */
function showLogin(msg) {
  document.body.classList.add('locked'); closeModal();
  $('#login').hidden = false; $('#frmLogin').hidden = false; $('#frmNewPwd').hidden = true; $('#loading').style.display = 'none';
  $('#loginMsg').textContent = msg || '';
  const lu = $('#lu'); if (!lu.value) lu.value = lsGet('last_user') || '';
  setTimeout(() => (lu.value ? $('#lp') : lu).focus(), 50);
}
function hideLogin() { document.body.classList.remove('locked'); $('#login').hidden = true; $('#lp').value = ''; $('#frmNewPwd').hidden = true; $('#frmLogin').hidden = false; }
function showNewPwd(u) { $('#frmLogin').hidden = true; $('#frmNewPwd').hidden = false; $('#npSub').textContent = `Hola, ${u.nombre}. Entraste con una contraseña temporal. Elige una nueva que solo tú conozcas.`; $('#np1').value = $('#np2').value = ''; setTimeout(() => $('#np1').focus(), 50); }

/* ---------- Mensajes ---------- */
let toastT;
function toast(msg, err) { clearTimeout(toastT); let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); } el.className = 'toast' + (err ? ' err' : ''); el.textContent = msg; toastT = setTimeout(() => el.remove(), 3200); }

/* ---------- Eventos ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-banco],[data-user],[data-go],[data-new],[data-edit],[data-act],[data-cuenta],[data-anio],[data-tab],[data-rango],[data-pend],[data-mes],[data-buscar],[data-theme-set],[data-close]');
  if (!t) return;
  const d = t.dataset;
  if (d.close !== undefined) { if (e.target === t) closeModal(); return; }
  if (d.user) { openUserForm(d.user); return; }
  if (d.banco) { S.banco = d.banco; render(); return; }
  if (d.go) { e.preventDefault(); go(d.go); return; }
  if (d.new) { const F = FORMS[d.new]; if (F && F.mod && !canEdit(F.mod)) { toast(can(MOD_PERM[F.mod]) ? 'El período está cerrado para ' + F.mod.toLowerCase() : 'No tienes permiso para registrar ' + F.mod.toLowerCase(), true); return; } if (F && F.perm && !can(F.perm)) { toast('No tienes permiso para esta acción', true); return; } openForm(d.new); return; }
  if (d.edit) { openForm(d.edit, d.id); return; }
  if (d.cuenta) { S.cuenta = d.cuenta; S.q = ''; S.all = false; go('gastos'); return; }
  if (d.anio) { S.anio = d.anio; render(); return; }
  if (d.tab) { S.tab = d.tab; render(); return; }
  if (d.rango !== undefined) { S.rango = Number(d.rango); render(); return; }
  if (d.pend !== undefined) { S.pend = d.pend === '1'; render(); return; }
  if (d.mes) { S.mes = d.mes; go('inicio'); return; }
  if (d.buscar) { S.q = d.buscar; S.cuenta = S.cuentaSel; S.all = true; go('gastos'); return; }
  if (d.themeSet !== undefined) { lsSet('theme', d.themeSet || null); applyTheme(); render(); return; }
  const a = d.act;
  if (a === 'mes-prev' || a === 'mes-next') { const ms = mesesConDatos(); const i = ms.indexOf(S.mes) + (a === 'mes-prev' ? -1 : 1); if (ms[i]) { S.mes = ms[i]; render(); } return; }
  if (a === 'del') return deleteRecord();
  if (a === 'resumen') return openResumen();
  if (a === 'copiar-ppto') {
    const prev = mesAnterior(S.mes), rows = detail('Presupuesto_Detalle', prev);
    const ya = detail('Presupuesto_Detalle', S.mes).length;
    if (!confirm(`Se agregarán ${rows.length} partidas de ${mesLabel(prev)} a ${mesLabel(S.mes)}${ya ? ` (ya hay ${ya}; podrían quedar duplicadas)` : ''}. ¿Continuar?`)) return;
    t.disabled = true;
    try { const ch = await Backend.call('saveMany', {table: 'Presupuesto_Detalle', mes: S.mes, rows: rows.map(r => ({Cuenta_Gastos: r.Cuenta_Gastos, Total: r.Total, Cantidad: r.Cantidad, UM: r.UM, Descripcion: r.Descripcion}))}); DB.apply(ch); render(); toast(rows.length + ' partidas copiadas'); }
    catch (err) { t.disabled = false; toast('No se pudo copiar: ' + err.message, true); }
    return;
  }
  if (a === 'add-year') {
    const y = Math.max(...periodos().map(p => p.Anio)) + 1;
    try { const ch = await Backend.call('addYear', {anio: y}); DB.apply(ch); S.anio = String(y); render(); toast('Períodos de ' + y + ' creados'); } catch (err) { toast(err.message, true); }
    return;
  }
  if (a === 'reload') { await boot(); if (DB.t.Cuentas) toast('Datos actualizados'); return; }
  if (a === 'logout') {
    try { await Backend.call('logout'); } catch (err) {}
    Auth.clear(); S.users = S.roles = S.permisos = null; S.tmpPwd = null; DB.load({tables: {}}); $('#view').innerHTML = ''; showLogin(); return;
  }
  if (a === 'pwd') return openPwdForm();
  if (a === 'mov-transfer' || a === 'mov-dep') { openForm('Movimientos_Banco'); if (a === 'mov-dep') { $('#f_Tipo').value = 'Depósito'; $('#f_ID_Banco_Destino').value = S.banco; } else if (S.banco) { $('#f_ID_Banco_Origen').value = S.banco; const o = bancos().find(b => String(b.ID_Banco) !== S.banco); if (o) $('#f_ID_Banco_Destino').value = o.ID_Banco; } formDynamics(); return; }
  if (a === 'repair') { t.disabled = true; try { const r = await Backend.call('repair'); toast((r.report || []).length ? r.report.length + ' correcciones aplicadas' : 'Todo estaba en orden'); await boot(); } catch (err) { toast(err.message, true); } t.disabled = false; return; }
  if (a === 'imp-ppto') return pickBudgetFile();
  if (a === 'tpl-ppto') return downloadBudgetTemplate();
  if (a === 'user-new') return openUserForm();
  if (a === 'eye') { const i = $('#lp'); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; t.textContent = show ? 'Ocultar' : 'Ver'; t.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña'); return; }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'frm') submitForm();
  if (e.target.id === 'frmLogin') (async () => {
    const b = e.target.querySelector('button[type=submit]'), u = $('#lu').value.trim().toLowerCase(), c = $('#lp').value;
    if (!u || !c) { $('#loginMsg').textContent = 'Escribe tu usuario y contraseña.'; return; }
    b.disabled = true; b.textContent = 'Entrando…'; $('#loginMsg').textContent = '';
    try { const r = await Backend.call('login', {usuario: u, clave: c}); Auth.set(r.session, r.user); lsSet('last_user', u);
      if (r.user.debeCambiar) { S.tmpPwd = c; showNewPwd(r.user); } else { hideLogin(); await boot(); } }
    catch (err) { $('#loginMsg').textContent = err.message; $('#lp').select(); }
    b.disabled = false; b.textContent = 'Entrar';
  })();
  if (e.target.id === 'frmNewPwd') (async () => {
    const n = $('#np1').value, c = $('#np2').value;
    if (n.length < 8) { $('#npMsg').textContent = 'La contraseña debe tener al menos 8 caracteres.'; return; }
    if (n !== c) { $('#npMsg').textContent = 'Las contraseñas no coinciden.'; return; }
    const b = e.target.querySelector('button[type=submit]'); b.disabled = true; $('#npMsg').textContent = '';
    try { const r = await Backend.call('changePassword', {actual: S.tmpPwd, nueva: n}); S.tmpPwd = null; Auth.set(r.session, r.user); hideLogin(); await boot(); toast('Contraseña creada'); }
    catch (err) { $('#npMsg').textContent = err.message; }
    b.disabled = false;
  })();
  if (e.target.id === 'frmImp') (async () => {
    const I = S.imp; if (!I || !I.rows.length) { closeModal(); return; }
    const rep = $('#impRep') ? $('#impRep').checked : false;
    const b = e.target.querySelector('button[type=submit]'); b.disabled = true; b.textContent = 'Importando…';
    try { const ch = await Backend.call(rep ? 'replaceMany' : 'saveMany', {table: 'Presupuesto_Detalle', mes: S.mes, rows: I.rows.map(({_cta, ...r}) => r)});
      DB.apply(ch); S.imp = null; closeModal(); render(); toast(I.rows.length + ' partidas importadas'); }
    catch (err) { b.disabled = false; b.textContent = 'Importar'; toast('No se pudo importar: ' + err.message, true); }
  })();
  if (e.target.id === 'frmPwd') (async () => {
    const a = $('#pa').value, n = $('#pn').value, c = $('#pc').value;
    if (n.length < 8) return toast('La contraseña nueva debe tener al menos 8 caracteres', true);
    if (n !== c) return toast('Las contraseñas nuevas no coinciden', true);
    const b = e.target.querySelector('button[type=submit]'); b.disabled = true;
    try { const r = await Backend.call('changePassword', {actual: a, nueva: n}); Auth.set(r.session, r.user); closeModal(); toast('Contraseña cambiada'); }
    catch (err) { b.disabled = false; toast(err.message, true); }
  })();
  if (e.target.id === 'frmUser') (async () => {
    const usuario = S.editUser || $('#uu').value.trim().toLowerCase(), clave = $('#uc').value;
    if (!/^[a-z0-9._-]{3,30}$/.test(usuario)) return toast('El usuario debe tener de 3 a 30 letras minúsculas o números, sin espacios', true);
    if ((!S.editUser || clave) && clave.length < 8) return toast('La contraseña debe tener al menos 8 caracteres', true);
    const rol = $('#ur').value, def = roleDefaults(rol), personalizados = {};
    document.querySelectorAll('#uperms [data-perm]').forEach(c => { if (c.checked !== def[c.dataset.perm]) personalizados[c.dataset.perm] = c.checked; });
    const b = e.target.querySelector('button[type=submit]'); b.disabled = true;
    try { const r = await Backend.call('saveUser', {usuario, nombre: $('#un').value.trim(), rol, activo: $('#ua').checked, clave: clave || undefined, debeCambiar: $('#ud').checked, personalizados});
      S.users = r.users; S.roles = r.roles; S.permisos = r.permisos; closeModal(); render(); toast(S.editUser ? 'Usuario actualizado' : 'Usuario creado'); }
    catch (err) { b.disabled = false; toast(err.message, true); }
  })();
  if (e.target.id === 'frmRes') (async () => {
    const b = e.target.querySelector('button[type=submit]'); b.disabled = true;
    try { const ch = await Backend.call('saveResumen', {mes: S.mes, Disp_Jerson: $('#dj').value, Disp_Mariela: $('#dm').value}); DB.apply(ch); closeModal(); render(); toast('Corte guardado'); }
    catch (err) { b.disabled = false; toast('No se pudo guardar: ' + err.message, true); }
  })();
});
let qT;
document.addEventListener('input', e => {
  const b = e.target.dataset.bind;
  if (b === 'q') { S.q = e.target.value; clearTimeout(qT); qT = setTimeout(() => { const pos = e.target.selectionStart; render(); const el = $('[data-bind=q]'); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }, 220); }
  if (FORM && e.target.closest('#frm')) formDynamics();
  if (FORM && e.target.name === 'Descripcion_Gasto' && e.inputType === 'insertReplacementText') autofillFromHistory(e.target);
});
document.addEventListener('change', async e => {
  const el = e.target, b = el.dataset.bind;
  if (el.id === 'mesSel') { S.mes = el.value; render(); return; }
  if (b === 'cuenta' || b === 'cuentaSel') { S[b] = el.value; render(); return; }
  if (b === 'all') { S.all = el.checked; render(); return; }
  if (el.id === 'ur' && $('#uperms')) { renderPerms(el.value, {}); return; }
  if (el.dataset.perm) { const def = roleDefaults($('#ur').value); el.closest('.perm').classList.toggle('custom', el.checked !== def[el.dataset.perm]); return; }
  if (FORM) { formDynamics(); if (FORM.F.fields.some(f => f.dep === el.name)) fillLists(); if (el.name === 'Descripcion_Gasto') autofillFromHistory(el); return; }
  if (el.dataset.flag) {
    const p = DB.t.Mes_Anio.find(x => String(x.ID) === el.dataset.pid); const row = {ID: p.ID}; row[el.dataset.flag] = el.checked;
    el.disabled = true;
    try { const ch = await Backend.call('save', {table: 'Mes_Anio', row}); DB.apply(ch); toast(`${el.closest('label').getAttribute('aria-label')}: ${el.checked ? 'activado' : 'desactivado'}`); }
    catch (err) { el.checked = !el.checked; toast(err.message, true); }
    el.disabled = false; renderMonthPicker();
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal').innerHTML) closeModal(); });
$('#fab').addEventListener('click', () => { const n = $('#fab').dataset.new; if (n) openForm(n); });
let rzT, lastW = window.innerWidth; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if (Math.abs(window.innerWidth - lastW) > 60 && !FORM && DB.t.Cuentas) { lastW = window.innerWidth; render(); } }, 250); });
window.addEventListener('scroll', () => $('#top').classList.toggle('scrolled', window.scrollY > 8), {passive: true});
function applyTheme() { const t = lsGet('theme'); if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }

/* ---------- Inicio ---------- */
async function boot() {
  $('#loading').style.display = 'grid';
  try {
    if (Backend.mode === 'setup') throw new Error('setup');
    if (Backend.online && !Auth.s) { showLogin(); return; }
    const data = await Backend.call('getAll');
    DB.load(data); hideLogin();
    const open = periodos().filter(p => truthy(p.Abierta)).pop();
    const ms = mesesConDatos();
    if (!S.mes || !ms.includes(S.mes)) S.mes = open ? open.Mes_Anio : ms[ms.length - 1];
    const h = (location.hash || '').slice(1); if (h && VIEWS[h] && S.view === 'inicio') S.view = h;
    render();
  } catch (e) {
    if (e.code !== 'AUTH') {
      $('#mp').style.display = 'none';
      $('#view').innerHTML = `<div class="panel empty" style="margin-top:30px">${e.message === 'setup'
        ? '<b>Falta la dirección del servicio</b>El administrador debe configurar la variable APPS_SCRIPT_URL en Netlify y volver a desplegar el sitio.'
        : '<b>No se pudieron cargar los datos</b>' + esc(e.message)}<div class="row" style="justify-content:center;margin-top:14px"><button class="btn" data-act="reload">Reintentar</button>${Backend.online ? '<button class="btn" data-act="logout">Cerrar sesión</button>' : ''}</div></div>`;
    }
  }
  $('#loading').style.display = 'none';
}
applyTheme(); Backend.detect(); boot();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/sw.js').catch(() => {});
